<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Visor GDL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --fg: #fff; --muted: #b9b9b9; --glass: rgba(18,18,18,.78); --line: rgba(255,255,255,.14);
    --accent: #ffd54a; --mountain: #9be7a1; --zone: #8fd3ff; --ok: #6be38a; --warn: #ffd54a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .glass { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #cross { position: fixed; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; pointer-events: none;
           border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.5); }
  #cross::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff; }

  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; justify-content: center; pointer-events: none; }
  #status { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #calBadge { pointer-events: auto; min-height: 44px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #000; }
  #calBadge.warn { background: var(--warn); }
  #calBadge.ok { background: var(--ok); }

  #banner { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 52px); left: 12px; right: 12px; display: flex; gap: 10px; align-items: center;
            padding: 10px 10px 10px 14px; border-radius: 14px; font-size: 15px; }
  #banner span { flex: 1; }
  #banner button { padding: 8px 14px; min-height: 44px; border-radius: 10px; background: #fff; color: #000; font-weight: 600; }
  #banner button.plain { background: none; color: #fff; text-decoration: underline; padding: 8px 4px; }

  #tapMark { position: fixed; width: 28px; height: 28px; margin: -14px 0 0 -14px; border: 3px solid var(--accent); border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 2px rgba(0,0,0,.6); }

  #focusCard { position: fixed; left: 12px; right: 76px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 66px); display: flex; gap: 12px; align-items: center;
               padding: 8px 14px 8px 8px; border-radius: 16px; text-align: left; min-height: 64px; }
  #focusCard img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #333; flex: none; }
  #focusCard img:not([src]) { display: none; }
  #focusCard .txt { flex: 1; min-width: 0; }
  #focusCard b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #focusCard small { color: var(--muted); font-size: 13px; }
  #focusCard .chev { font-size: 26px; color: var(--muted); }

  #bar { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 12px; right: 12px; display: flex; gap: 10px; }
  #bar button { flex: 1; min-height: 52px; border-radius: 14px; font-weight: 600; color: #fff; font-size: 15px; }
  #bar #btnCal { flex: 1.3; background: var(--accent); color: #000; }
  #btnFreeze { position: fixed; right: 12px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 66px); width: 52px; height: 52px; border-radius: 50%; font-size: 20px; }
  #btnFreeze.on { background: var(--accent); color: #000; }
  #overlay { touch-action: none; }
  .map { position: relative; }
  .map canvas { position: static; display: block; width: 100%; height: 300px; border-radius: 12px; background: #222; touch-action: none; }
  #findMap { height: min(52vh, 420px); }
  .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 44px; height: 44px; border-radius: 10px; background: #fff; color: #000; font-size: 24px; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .tabs { display: flex; gap: 6px; margin: 4px 0 12px; padding: 4px; border-radius: 12px; background: #2a2a2a; }
  .tabs button { flex: 1; min-height: 44px; border-radius: 9px; background: none; font-weight: 600; }
  .tabs button[aria-selected="true"] { background: #fff; color: #000; }
  select { font: inherit; width: 100%; min-height: 44px; padding: 10px; margin-top: 6px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; }
  .mapNote { font-size: 12px; color: var(--muted) !important; margin: 4px 0 12px !important; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .btn { flex: 1; }
  .row .del { flex: 0 0 50px; text-align: center; }
  #guide { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 52px); left: 12px; right: 12px; display: flex; gap: 10px; align-items: center;
           padding: 8px 8px 8px 14px; border-radius: 14px; font-size: 15px; }
  #guide span { flex: 1; }
  #banner:not([hidden]) ~ #guide { top: calc(max(10px, env(safe-area-inset-top)) + 156px); }
  #guide button { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.15); }
  .group { margin: 16px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 86%; overflow: auto; background: #161616; border-radius: 20px 20px 0 0;
           padding-bottom: max(16px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.5); }
  .sheet .body { padding: 18px 18px 0; }
  .sheet h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.2; }
  .sheet p { margin: 0 0 14px; color: #ddd; }
  .sheet ul { list-style: none; margin: 0 0 14px; padding: 0; }
  .sheet a { color: var(--accent); }
  .sheet .close { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 18px; z-index: 2; }
  .sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: #444; margin: 8px auto 0; }
  .btn { display: block; width: 100%; min-height: 50px; border-radius: 12px; background: #2a2a2a; color: #fff; text-align: left; padding: 0 16px; margin-bottom: 8px; }
  .btn small { color: var(--muted); margin-left: 6px; }
  .btn.main { background: var(--accent); color: #000; text-align: center; font-weight: 600; }
  .btn.plain { text-align: center; }
  .btn.main small { color: #333; }
  .btn.opt { padding: 12px 16px; font-weight: 600; }
  .sheet label.floor { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .sheet label.floor input { width: 90px; margin: 0; }
  .warnTxt { color: var(--warn) !important; }
  .btn small.d { display: block; margin: 4px 0 0; font-weight: 400; line-height: 1.35; }

  #carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: #000; }
  #carousel::-webkit-scrollbar { display: none; }
  #carousel a { flex: 0 0 100%; scroll-snap-align: center; }
  #carousel img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  #carousel:empty { display: none; }
  #dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  #dots i { width: 7px; height: 7px; border-radius: 50%; background: #555; }
  #dots i.on { background: #fff; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #chips span { padding: 4px 10px; border-radius: 999px; background: #2a2a2a; font-size: 13px; color: #ddd; }
  #credits { font-size: 12px; color: #888; margin-bottom: 14px; }
  #credits a { color: #aaa; }
  #credits li { margin-bottom: 4px; }

  .sheet label { display: block; margin-bottom: 16px; color: #ddd; }
  .sheet input[type=number], .sheet input[type=text] { font: inherit; width: 100%; padding: 12px; margin-top: 6px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; }
  .sheet input[type=range] { width: 100%; height: 44px; margin: 4px 0 0; accent-color: var(--accent); }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 28px; gap: 16px; overflow: auto;
            background: radial-gradient(120% 80% at 50% 0%, #2a3a5e, #0d1424 60%); }
  .screen h1 { margin: 0; font-size: 34px; }
  .screen h1 img { display: block; width: 120px; height: 120px; border-radius: 22px; }
  .screen h2 { margin: 0; font-size: 26px; }
  .screen h3 { margin: 0 0 4px; font-size: 16px; }
  .screen p { margin: 0; color: #ddd; }
  .screen .lead { font-size: 21px; font-weight: 700; line-height: 1.3; color: #fff; }
  .screen ul { margin: 8px 0 0; padding-left: 22px; color: #ddd; }
  .screen li { margin-bottom: 6px; }
  .screen small { color: var(--muted); }
  #deniedSteps { display: flex; flex-direction: column; gap: 14px; }
  #deniedSteps section { padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.08); }
  .screen .btn.plain { background: none; color: #fff; text-decoration: underline; }
  .big { min-height: 56px; border-radius: 14px; background: var(--accent); color: #000; font-weight: 700; font-size: 18px; }

  #toast { position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 56px); transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
           padding: 10px 16px; border-radius: 12px; display: none; text-align: center; }
  #landscape { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #111; font-size: 20px; padding: 24px; text-align: center; }
  @media (orientation: landscape) and (max-height: 500px) { #landscape { display: flex; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="overlay"></canvas>
<div id="cross"></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<div id="top">
  <div id="status" class="glass" data-t="gpsWait">Esperando GPS…</div>
  <button id="calBadge" class="warn" hidden data-t="uncal">Sin calibrar</button>
</div>
<div id="banner" class="glass" hidden><span id="bannerText" aria-live="polite"></span><button id="bannerBtn"></button><button id="bannerBtn2" class="plain" hidden></button></div>
<div id="tapMark" hidden></div>
<div id="guide" class="glass" hidden><span id="guideText"></span><button id="guideClose" data-t-aria="stopFind" aria-label="Dejar de buscar">✕</button></div>
<div id="toast" class="glass" role="alert"></div>

<button id="focusCard" class="glass" hidden>
  <img id="focusImg" alt="">
  <span class="txt"><b id="focusName"></b><small id="focusMeta"></small></span>
  <span class="chev" aria-hidden="true">›</span>
</button>

<button id="btnFreeze" class="glass" data-t-aria="freeze" aria-label="Congelar imagen">⏸</button>
<nav id="bar">
  <button id="btnCal" data-t="calibrate">Calibrar</button>
  <button id="btnFind" class="glass" data-t="find">Buscar</button>
  <button id="btnShot" class="glass" data-t="shot">Foto</button>
  <button id="btnSet" class="glass" data-t="settings">Ajustes</button>
</nav>

<div id="backdrop" hidden></div>

<section id="infoPanel" class="sheet" role="dialog" aria-modal="true" aria-labelledby="infoName" hidden>
  <button class="close" id="infoClose" data-t-aria="close" aria-label="Cerrar">✕</button>
  <div id="carousel"></div>
  <div id="dots" aria-hidden="true"></div>
  <div class="body">
    <h2 id="infoName"></h2>
    <div id="chips"></div>
    <p id="infoText"></p>
    <p id="infoLink"></p>
    <ul id="credits"></ul>
  </div>
</section>

<section id="calPanel" class="sheet" role="dialog" aria-modal="true" aria-labelledby="calTitle" hidden>
  <div class="grip"></div>
  <div class="body">
    <h2 id="calTitle" data-t="calTitle">¿Cómo calibrar?</h2>
    <p data-t="calIntro"></p>
    <button id="calWhere" class="btn"></button>
    <label class="floor"><span data-t="calFloorQ"></span> <input id="calFloor" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
    <p id="calGps" class="warnTxt" hidden></p>
    <button id="calGuided" class="btn opt main"><span data-t="calGuided"></span> <small data-t="recommended"></small><small class="d" data-t="calGuidedD"></small></button>
    <button id="calSky" class="btn opt"><span data-t="calSky"></span><small class="d" data-t="calSkyD"></small></button>
    <button id="calAny" class="btn opt"><span data-t="calAny"></span><small class="d" data-t="calAnyD"></small></button>
    <button id="calNone" class="btn opt"><span data-t="calNone"></span><small class="d" data-t="calNoneD"></small></button>
    <button id="calClose" class="btn plain" data-t="close"></button>
  </div>
</section>

<section id="spotPanel" class="sheet" role="dialog" aria-modal="true" aria-labelledby="spotTitle" hidden>
  <div class="grip"></div>
  <div class="body">
    <h2 id="spotTitle" data-t="spotTitle"></h2>
    <p data-t="spotIntro"></p>
    <ul id="spotList"></ul>
    <div id="spotNew" hidden>
      <p data-t="spotTap"></p>
      <div class="map">
        <canvas id="spotMap"></canvas>
        <div class="zoom"><button id="spotZoomIn" data-t-aria="zoomIn">+</button><button id="spotZoomOut" data-t-aria="zoomOut">−</button></div>
      </div>
      <p class="mapNote" data-t="mapCredit"></p>
      <label><span data-t="spotName"></span> <input id="spotName" type="text" maxlength="30" data-t-ph="spotNamePh"></label>
      <label><span data-t="spotFloor"></span> <input id="spotFloor" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
      <button id="spotSave" class="btn main" data-t="spotSave"></button>
    </div>
    <button id="spotAdd" class="btn" data-t="spotAdd"></button>
    <button id="spotClose" class="btn plain" data-t="close"></button>
  </div>
</section>

<section id="findPanel" class="sheet" role="dialog" aria-modal="true" aria-labelledby="findTitle" hidden>
  <div class="grip"></div>
  <div class="body">
    <h2 id="findTitle" data-t="findTitle"></h2>
    <div class="tabs" role="tablist">
      <button id="tabList" role="tab" aria-selected="true" aria-controls="findList" data-t="tabList"></button>
      <button id="tabMap" role="tab" aria-selected="false" aria-controls="findMapBox" data-t="tabMap"></button>
    </div>
    <p id="findIntro" data-t="findIntro"></p>
    <div id="findNoPos" hidden><p class="warnTxt" data-t="noPos"></p><button id="findPick" class="btn main" data-t="gpsPick"></button></div>
    <div id="findList" role="tabpanel" aria-labelledby="tabList"></div>
    <div id="findMapBox" role="tabpanel" aria-labelledby="tabMap" hidden>
      <p class="mapNote" data-t="mapHint"></p>
      <div class="map">
        <canvas id="findMap"></canvas>
        <div class="zoom"><button id="zoomIn" data-t-aria="zoomIn">+</button><button id="zoomOut" data-t-aria="zoomOut">−</button></div>
      </div>
      <p class="mapNote" data-t="mapCredit"></p>
    </div>
    <button id="findClose" class="btn plain" data-t="close"></button>
  </div>
</section>

<section id="pickPanel" class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickTitle" hidden>
  <div class="grip"></div>
  <div class="body">
    <h2 id="pickTitle" data-t="pickTitle"></h2>
    <p data-t="pickIntro"></p>
    <ul id="pickList"></ul>
    <button id="pickCancel" class="btn plain" data-t="cancel"></button>
  </div>
</section>

<section id="setPanel" class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <div class="grip"></div>
  <div class="body">
    <h2 id="setTitle" data-t="settings"></h2>
    <label><span data-t="language"></span>
      <select id="inLang"></select>
    </label>
    <label><span data-t="setFloor"></span>
      <input id="inFloor" type="number" min="0" max="100" step="1" inputmode="numeric">
    </label>
    <label><span data-t="setGround"></span>
      <input id="inGround" type="number" min="0" max="5000" step="1" inputmode="numeric">
    </label>
    <label><span id="fovOut"></span>
      <input id="inFov" type="range" min="30" max="110" step="1">
    </label>
    <button id="setWhere" class="btn" data-t="mySpots"></button>
    <button id="calReset" class="btn plain" data-t="clearCal"></button>
    <button id="setClose" class="btn main" data-t="done"></button>
  </div>
</section>

<div id="start" class="screen">
  <h1><img src="icon-512.png" alt="Visor GDL" width="140" height="140"></h1>
  <p class="lead" data-t="tagline"></p>
  <div>
    <p data-t="whyTitle"></p>
    <ul>
      <li data-t="whyCam"></li>
      <li data-t="whyLoc"></li>
      <li id="whyMotion" data-t="whyMotion" hidden></li>
    </ul>
  </div>
  <small data-t="startTip"></small>
  <button id="btnStart" class="big" data-t="start"></button>
  <button id="btnNoCam" class="btn plain" data-t="startNoCam"></button>
</div>

<div id="denied" class="screen" role="alertdialog" aria-labelledby="deniedTitle" hidden>
  <h2 id="deniedTitle" data-t="deniedTitle"></h2>
  <p id="deniedWhat"></p>
  <div id="deniedSteps">
    <section data-os="android"><h3 data-t="deniedAndroid"></h3><p data-t="deniedAndroidSteps"></p></section>
    <section data-os="ios"><h3 data-t="deniedIos"></h3><p data-t="deniedIosSteps"></p></section>
  </div>
  <button id="deniedRetry" class="big" data-t="deniedRetry"></button>
  <button id="deniedAlt" class="btn plain"></button>
</div>

<div id="landscape" data-t="landscape"></div>

<script type="module">
import { angleSpread, distBearing, elevAngle, dirVector, cameraBasis, headingPitch, project, smoothBasis, rayMax, tiltBasis, solveCalibration, skyEdges, matchSkyline, withTowers } from "./geo.js";
import { loadArea, elevation } from "./terrain.js";
import { LANDMARKS, PERFILES } from "./landmarks.js";
import { t, initLang, setLang, applyLang, getLang, LANGS } from "./i18n.js";

const FLOOR_HEIGHT = 3.2;   // m por piso
const EYE_HEIGHT = 1.6;     // m sobre la azotea
const DECLINATION = 3.8;    // declinación magnética en GDL (aprox, grados al este). La calibración la corrige.
const FAR_M = 135000;       // alcance del relieve
const $ = (id) => document.getElementById(id);
const wrap = (d) => ((d % 360) + 540) % 360 - 180;
const DEG = 180 / Math.PI;

// --- Ajustes guardados (pueden fallar en modo incógnito) ---
const store = {
  get(k, d) { try { const v = localStorage.getItem("visor." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("visor." + k, JSON.stringify(v)); } catch {} },
};
const cfg = {
  corr: store.get("corr", DECLINATION), // grados a sumar al rumbo de la brújula para obtener el real
  pitch: store.get("pitch", 0),         // corrección de inclinación (grados)
  floor: store.get("floor", 27),
  fov: store.get("fov", 65),            // grados, lado largo de la imagen de la cámara
  ground: store.get("groundManual", null),
};

let INFO = {}; // textos y fotos de Wikipedia, bajados por tools/fetch_info.py
fetch("info/info.json").then((r) => (r.ok ? r.json() : {})).then((j) => { INFO = j; focus = null; }).catch(() => {});

let pos = null;        // { lat, lon, acc }
let items = [];        // puntos con distancia, rumbo, ángulo vertical y silueta
let skyline = null;    // [{ az, angle, dist }] cada 0.5°
let reliefFor = null, reliefReady = false, calcFor = null;

// --- Orientación ---
// La brújula cambia su lectura al inclinar el teléfono (imanes, magnetómetro mal calibrado).
// El giroscopio no, así que después de calibrar el rumbo sale solo del giroscopio.
// ponytail: el giroscopio se desvía ~1° cada pocos minutos; hay que volver a calibrar.
// Mejora posible: corregirlo despacio hacia la brújula cuando el teléfono esté nivelado.
let absBasis = null;   // con brújula (deviceorientationabsolute)
let relBasis = null;   // con giroscopio, norte arbitrario (deviceorientation)
let gyroCorr = null;   // corrección del giroscopio, fijada al calibrar; se pierde al recargar
let autoCorr = null;   // antes de calibrar: hace que el giroscopio siga a la brújula
let calibrated = false;
let basis = null, corr = 0, mode = "";
let lastSensor = 0;

function onAbsolute(e) {
  if (e.alpha == null) return;
  if (!absBasis) announce(t("compassReady"));
  lastSensor = performance.now();
  absBasis = smoothBasis(absBasis, cameraBasis(e.alpha, e.beta, e.gamma), 0.15);
  // Muestra para medir si la brújula está estable: su rumbo menos el del giroscopio
  // (si giras el teléfono los dos cambian igual; si hay un imán, solo la brújula salta).
  const raw = headingPitch(cameraBasis(e.alpha, e.beta, e.gamma));
  if (Math.abs(raw.pitch) < 60) compassSamples.push({ t: lastSensor, h: raw.heading - (relRaw ?? 0), gyro: relRaw != null });
}
function onRelative(e) {
  if (e.alpha == null) return;
  if (e.absolute) return onAbsolute(e); // teléfonos sin giroscopio
  lastSensor = performance.now();
  relRaw = headingPitch(cameraBasis(e.alpha, e.beta, e.gamma)).heading;
  // iPhone: no hay evento absoluto; la brújula llega aparte como webkitCompassHeading
  // (rumbo de la cámara, magnético). Se gira alpha para que el rumbo coincida con ella.
  // ponytail: sin probar en un iPhone real; si el rumbo sale volteado, revisar el signo.
  if (e.webkitCompassAccuracy != null) compassAcc = e.webkitCompassAccuracy;
  if (e.webkitCompassHeading != null && e.webkitCompassAccuracy >= 0) {
    const h = headingPitch(cameraBasis(e.alpha, e.beta, e.gamma)).heading;
    onAbsolute({ alpha: e.alpha + h - e.webkitCompassHeading, beta: e.beta, gamma: e.gamma });
  }
  relBasis = smoothBasis(relBasis, cameraBasis(e.alpha, e.beta, e.gamma), 0.3);
}
// Brújula inestable: aviso que no bloquea, como mucho una vez por minuto.
// iPhone da su precisión en grados (webkitCompassAccuracy; -1 = sin calibrar). En los demás se mide
// cuánto salta el rumbo en los últimos 2 s: contra el giroscopio si hay, si no el rumbo solo.
let compassSamples = [], compassAcc = null, relRaw = null, compassBadFor = 0, compassWarned = -Infinity;
setInterval(() => {
  const now = performance.now();
  compassSamples = compassSamples.filter((s) => now - s.t < 2000);
  const gyro = compassSamples.every((s) => s.gyro);
  const spread = compassSamples.length >= 10 ? angleSpread(compassSamples.map((s) => s.h)) : 0;
  const bad = (compassAcc != null && (compassAcc < 0 || compassAcc > 30)) || spread > (gyro ? 5 : 15);
  compassBadFor = bad ? compassBadFor + 1 : 0;
  // Ya calibrado con el giroscopio, la brújula no se usa: no hace falta avisar.
  if (compassBadFor >= 3 && gyroCorr == null && !frozen && $("start").hidden && $("backdrop").hidden && now - compassWarned > 60000) {
    compassWarned = now; toast(t("compassBad"));
  }
}, 1000);

// Congelar: la imagen y la orientación se quedan quietas para tocar nombres con calma.
let frozen = null; // { kind: "rel" | "abs" } mientras está congelado
const usingGyro = () => (frozen ? frozen.kind === "rel" : basis != null && basis === relBasis);
function pickView() {
  if (frozen) return;
  if (relBasis && absBasis) {
    basis = relBasis;
    if (gyroCorr != null) { corr = gyroCorr; mode = "giroscopio"; return; }
    const target = headingPitch(absBasis).heading + cfg.corr - headingPitch(relBasis).heading;
    autoCorr = autoCorr == null ? target : autoCorr + wrap(target - autoCorr) * 0.02;
    corr = autoCorr; mode = "brújula";
  } else if (absBasis) {
    basis = absBasis; corr = cfg.corr; mode = "brújula";
  }
}

// --- Relieve y cálculos por posición ---
const viewerAlt = () => (cfg.ground ?? 1560) + cfg.floor * FLOOR_HEIGHT + EYE_HEIGHT;
// Relieve fino cerca, grueso lejos: zoom 10 (~150 m) hasta 40 km, 9 (~300 m) hasta 80 km, 8 (~600 m) después.
const sample = (lat, lon, d) => {
  let e = NaN;
  if (d < 40000) e = elevation(lat, lon, 10);
  if (Number.isNaN(e) && d < 80000) e = elevation(lat, lon, 9);
  return Number.isNaN(e) ? elevation(lat, lon, 8) : e;
};
const skylineAt = (az) => {
  if (!skyline) return 0;
  const t = (((az % 360) + 360) % 360) * 2, i = Math.floor(t), k = t - i;
  return skyline[i % skyline.length].angle * (1 - k) + skyline[(i + 1) % skyline.length].angle * k;
};

function recompute() {
  if (!pos) return;
  const h0 = viewerAlt();
  if (reliefReady) {
    skyline = [];
    for (let az = 0; az < 360; az += 0.5) skyline.push({ az, ...rayMax(sample, pos.lat, pos.lon, h0, az, 500, FAR_M) });
  }
  items = LANDMARKS.map((l) => {
    const { dist, bearing } = distBearing(pos.lat, pos.lon, l.lat, l.lon);
    const it = { ...l, dist, bearing, el: elevAngle(h0, l.alt, dist) };
    if (reliefReady && dist <= FAR_M) {
      // Oculto si el relieve entre tú y el punto sube más que su punta.
      it.hidden = rayMax(sample, pos.lat, pos.lon, h0, bearing, 500, dist * 0.95).angle > it.el + 0.3;
      if (l.tipo === "m" && !it.hidden) it.ridge = ridgeOf(it, h0);
    }
    // Zonas que no se ven: la etiqueta va sobre el horizonte, apuntando hacia ellas.
    if (l.tipo === "z" && (dist > FAR_M || it.hidden)) { it.onHorizon = true; it.hidden = false; it.el = skylineAt(bearing); }
    return it;
  }).filter((l) => l.dist > 150);
}

// Silueta de una montaña: horizonte cada 0.1° alrededor de la cumbre, mientras esté
// a una distancia parecida a la cumbre (±30%), hasta ±8°.
function ridgeOf(l, h0) {
  const pts = [];
  for (let i = -80; i <= 80; i++) {
    const az = l.bearing + i / 10;
    pts.push({ az, ...rayMax(sample, pos.lat, pos.lon, h0, az, 500, Math.min(FAR_M, l.dist * 1.4)) });
  }
  const same = (i) => i >= 0 && i < pts.length && Math.abs(pts[i].dist - l.dist) < l.dist * 0.3;
  let a = 80, b = 80;
  while (same(b + 1)) b++;
  while (same(a - 1)) a--;
  return b - a >= 4 ? pts.slice(a, b + 1) : null;
}

async function loadRelief(lat, lon) {
  reliefFor = { lat, lon };
  reliefReady = false;
  await Promise.all([loadArea(lat, lon, 200, 12), loadArea(lat, lon, 40000, 10), loadArea(lat, lon, 80000, 9), loadArea(lat, lon, FAR_M, 8)]);
  const g = elevation(lat, lon, 12);
  if (store.get("groundManual", null) == null && Number.isFinite(g)) { cfg.ground = Math.round(g); $("inGround").value = cfg.ground; }
  if (!Number.isFinite(g)) toast(t("reliefFail"));
  reliefReady = true;
  recompute();
}

// --- Lugares guardados: dentro de un edificio el GPS se va decenas de metros; un punto fijo no. ---
let gps = null;
let spots = store.get("spots", []);       // [{ nombre, lat, lon, floor }] solo en este teléfono
let spotName = store.get("spot", null);   // lugar en uso, o null = GPS
const activeSpot = () => spots.find((x) => x.nombre === spotName) || null;
function onPosition(p) {
  if (!gps) announce(t("gpsReady", { acc: Math.round(p.coords.accuracy) }));
  gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
  store.set("lastPos", { lat: gps.lat, lon: gps.lon }); // centro del mapa si otro día no hay GPS
  applyPos();
}
function applyPos() {
  const sp = activeSpot();
  const src = sp ? { lat: sp.lat, lon: sp.lon, acc: 0, spot: sp.nombre } : gps;
  if (!src) return;
  const first = !pos;
  pos = src;
  if (gpsHelp) { gpsHelp = false; $("banner").hidden = true; }
  const moved = reliefFor ? distBearing(reliefFor.lat, reliefFor.lon, pos.lat, pos.lon).dist : Infinity;
  if (moved > 300) loadRelief(pos.lat, pos.lon);
  // El horizonte cuesta ~0.2 s; solo se recalcula si te moviste más de 30 m.
  if (!calcFor || distBearing(calcFor.lat, calcFor.lon, pos.lat, pos.lon).dist > 30) { calcFor = pos; recompute(); }
  if (first && !$("findPanel").hidden) openFind(); // la lista esperaba la posición
}

// --- Cámara y proyección ---
const cv = $("overlay"), ctx = cv.getContext("2d"), video = $("cam");
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize); resize();

// f = K / tan(fov/2), donde K es medio lado largo del video, escalado como "cover" a la pantalla.
function focalK() {
  const W = innerWidth, H = innerHeight;
  const vw = video.videoWidth || W, vh = video.videoHeight || H;
  return (Math.max(vw, vh) / 2) * Math.max(W / vw, H / vh);
}
const focal = () => focalK() / Math.tan(cfg.fov / 2 / DEG);
const fovFromF = (f) => 2 * Math.atan(focalK() / f) * DEG;

const card = (az) => t("dirs")[Math.round((((az % 360) + 360) % 360) / 45) % 8];
const locale = () => (getLang() === "es" ? "es-MX" : "en-US");
const fmtDist = (m) => m < 10000 ? (m / 1000).toFixed(1) + " km" : Math.round(m / 1000).toLocaleString(locale()) + " km";
const distDir = (l) => t("distDir", { dist: fmtDist(l.dist), dir: card(l.bearing) });
const COLOR = { m: "#9be7a1", e: "#ffd54a", z: "#8fd3ff" };
const TIPO = { m: "tipoM", e: "tipoE", z: "tipoZ" };

// --- Dibujo ---
let view = null; // { b, f, cx, cy } del último cuadro
let hits = [];   // rectángulos de etiquetas para detectar toques
let focus = null;

const P = (az, el) => project(dirVector(az - corr, el), view.b, view.f, view.cx, view.cy);

function outline(path, fill, color, width) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(path); }
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(0,0,0,.65)"; ctx.lineWidth = width + 2.5; ctx.stroke(path);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(path);
}

function drawSkyline() {
  const path = new Path2D();
  let pen = false;
  for (const s of [...skyline, skyline[0]]) {
    const p = s.dist > 1500 && P(s.az, s.angle); // se omite el suelo cercano
    if (!p) { pen = false; continue; }
    pen ? path.lineTo(p.x, p.y) : path.moveTo(p.x, p.y);
    pen = true;
  }
  outline(path, null, "rgba(255,255,255,.5)", 1.2);
}

// Montaña: solo la cresta, en verde.
function drawRidge(pts) {
  const proj = pts.map((s) => P(s.az, s.angle));
  if (proj.some((p) => !p)) return;
  const line = new Path2D();
  proj.forEach((p, i) => (i ? line.lineTo(p.x, p.y) : line.moveTo(p.x, p.y)));
  outline(line, null, "#9be7a1", 3);
}

// Edificio: su perfil (ver PERFILES) escalado a su alto y ancho reales, desde el suelo.
function drawBuilding(l, h0) {
  const shape = PERFILES[l.perfil] || PERFILES.bloque;
  const base = l.alt - l.h;
  const poly = shape.poly.map(([nx, ny]) => P(l.bearing + Math.atan2(nx * l.w, l.dist) * DEG, elevAngle(h0, base + ny * l.h, l.dist)));
  if (poly.some((p) => !p)) return;
  // Solo el contorno, más grande que el edificio para enmarcarlo: 25% más, y al menos 34 px de alto
  // en los lejanos (sin pasar de 5 veces ni de 140 px de ancho).
  const xs = poly.map((p) => p.x), ys = poly.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const k = Math.max(1.25, Math.min(34 / (y1 - y0 || 1), 5, 140 / (x1 - x0 || 1)));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, path = new Path2D();
  poly.forEach((p, i) => { const x = cx + (p.x - cx) * k, y = cy + (p.y - cy) * k; i ? path.lineTo(x, y) : path.moveTo(x, y); });
  path.closePath();
  outline(path, null, "#ffd54a", 2.2);
}

function drawIcon(tipo, x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  if (tipo === "m") { ctx.moveTo(x, y - 5); ctx.lineTo(x + 5.5, y + 4); ctx.lineTo(x - 5.5, y + 4); ctx.closePath(); }
  else if (tipo === "e") ctx.rect(x - 4, y - 5, 8, 10);
  else ctx.arc(x, y, 4.5, 0, 7);
  ctx.fill();
}

function draw() {
  requestAnimationFrame(draw);
  const W = innerWidth, H = innerHeight;
  ctx.clearRect(0, 0, W, H);
  hits = [];
  pickView();
  if (!basis) {
    if (lastSensor === 0 && performance.now() > 3000 && $("status").textContent !== t("noCompass")) { $("status").textContent = t("noCompass"); announce(t("noCompass")); }
    return;
  }
  const { heading } = headingPitch(basis);
  const trueHeading = (heading + corr + 360) % 360;
  $("status").textContent = !pos ? t("gpsWait")
    : `${Math.round(trueHeading)}° ${card(trueHeading)} · ${pos.spot ? `📍 ${pos.spot} · ${t("floorN", { n: cfg.floor })}` : `${Math.round(viewerAlt())} m · ±${Math.round(pos.acc)} m`}` + (reliefReady ? "" : " · " + t("loadingRelief"));
  $("calBadge").hidden = false;
  $("calBadge").textContent = t(calibrated ? "cal" : "uncal");
  $("calBadge").className = calibrated ? "ok" : "warn";
  if (!pos) return;

  const h0 = viewerAlt();
  view = { b: tiltBasis(basis, cfg.pitch), f: focal(), cx: W / 2, cy: H / 2 };
  if (skyline) drawSkyline();
  if (autoPending && skyline && video.videoWidth) { autoPending = false; openCalMenu(); }
  if (autoMode) autoStep();
  if (autoDots) {
    ctx.fillStyle = "#4fc3ff";
    for (const d of autoDots.filter((_, i) => i % 4 === 0)) { const p = P(d.az, d.el); if (p) { ctx.beginPath(); ctx.arc(p.x, p.y + 6, 2.5, 0, 7); ctx.fill(); } }
  }

  const shown = [];
  for (const l of items) {
    const p = P(l.bearing, l.el);
    if (!p || p.x < -40 || p.x > W + 40) continue;
    if (!l.hidden) {
      if (l.ridge) drawRidge(l.ridge);
      if (l.tipo === "e") drawBuilding(l, h0);
    }
    shown.push({ l, p });
  }

  // Lo que está bajo el círculo central: el más cercano a la mira, hasta 55 px.
  let best = null, bestD = 55;
  for (const s of shown) {
    const d = Math.hypot(s.p.x - view.cx, (s.p.y - view.cy) / 3);
    if (!s.l.hidden && d < bestD) { best = s.l; bestD = d; }
  }
  setFocus(best);

  // Etiquetas: las más cercanas al centro se colocan primero y suben si chocan con otra.
  shown.sort((a, b) => Math.abs(a.p.x - view.cx) - Math.abs(b.p.x - view.cx));
  const placed = [], labels = [];
  for (const s of shown) {
    const l = s.l, isFocus = focus && l.nombre === focus.nombre;
    const name = (l.onHorizon ? "→ " : "") + l.nombre, dist = fmtDist(l.dist) + (l.hidden ? " · " + t("hiddenShort") : "");
    ctx.font = "600 15px system-ui, sans-serif";
    const wName = ctx.measureText(name).width;
    ctx.font = "400 13px system-ui, sans-serif";
    const wDist = ctx.measureText(dist).width;
    const w = 26 + wName + 7 + wDist + 12;
    const x0 = Math.min(Math.max(s.p.x - w / 2, 4), W - w - 4);
    const ay = Math.min(Math.max(s.p.y, 100), H - 170);
    let ly = ay - 36;
    while (ly > 70 && placed.some(([a, b, y]) => x0 < b + 4 && x0 + w > a - 4 && Math.abs(ly - y) < 30)) ly -= 32;
    placed.push([x0, x0 + w, ly]);
    labels.push({ l, isFocus, name, dist, wName, w, x0, ay, ly, px: s.p.x });
  }
  // Primero todas las líneas, luego las etiquetas encima, para que ninguna línea cruce un texto.
  for (const { l, ay, ly, px } of labels) {
    ctx.globalAlpha = l.hidden ? 0.5 : 1;
    ctx.strokeStyle = COLOR[l.tipo]; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px, ay); ctx.lineTo(px, ly + 13); ctx.stroke();
    ctx.fillStyle = COLOR[l.tipo]; ctx.beginPath(); ctx.arc(px, ay, 3.5, 0, 7); ctx.fill();
  }
  for (const { l, isFocus, name, dist, wName, w, x0, ly } of labels) {
    const color = COLOR[l.tipo];
    ctx.globalAlpha = l.hidden ? 0.5 : 1;
    ctx.fillStyle = isFocus ? "#fff" : "rgba(15,15,15,.82)";
    ctx.beginPath(); ctx.roundRect(x0, ly - 14, w, 28, 14); ctx.fill();
    drawIcon(l.tipo, x0 + 15, ly, isFocus ? "#000" : color);
    ctx.textBaseline = "middle";
    ctx.font = "600 15px system-ui, sans-serif"; ctx.fillStyle = isFocus ? "#000" : "#fff";
    ctx.fillText(name, x0 + 26, ly);
    ctx.font = "400 13px system-ui, sans-serif"; ctx.fillStyle = isFocus ? "#444" : "#bbb";
    ctx.fillText(dist, x0 + 26 + wName + 7, ly + 1);
    ctx.globalAlpha = 1;
    hits.push({ l, x0: x0 - 6, x1: x0 + w + 6, y0: ly - 22, y1: ly + 22 });
  }
  if (target) drawTarget(W, H, trueHeading);
}

// --- Tarjeta de lo que está en la mira ---
function setFocus(l) {
  if ((l && l.nombre) === (focus && focus.nombre)) { if (l) focus = l; return; }
  focus = l;
  const busy = calMode || !$("backdrop").hidden;
  $("focusCard").hidden = !l || busy;
  if (!l) return;
  $("focusName").textContent = l.nombre;
  $("focusMeta").textContent = `${distDir(l)} · ${t("seeDetails")}`;
  const img = INFO[l.nombre]?.fotos?.[0]?.src;
  img ? $("focusImg").setAttribute("src", img) : $("focusImg").removeAttribute("src");
}
$("focusCard").onclick = () => focus && openInfo(focus);

// --- Hojas (paneles inferiores) ---
function openSheet(id) {
  for (const s of ["infoPanel", "pickPanel", "setPanel", "findPanel", "calPanel", "spotPanel"]) $(s).hidden = s !== id;
  $("backdrop").hidden = false;
  $("focusCard").hidden = true;
}
function closeSheets() {
  for (const s of ["infoPanel", "pickPanel", "setPanel", "findPanel", "calPanel", "spotPanel"]) $(s).hidden = true;
  $("backdrop").hidden = true;
  focus = null; // la tarjeta vuelve a aparecer en el siguiente cuadro
}
$("backdrop").onclick = () => { if (!$("pickPanel").hidden) cancelPick(); else closeSheets(); };
addEventListener("keydown", (e) => e.key === "Escape" && closeSheets());

// --- Detalles ---
function openInfo(l, back = false) {
  infoBack = back;
  const d = INFO[l.nombre];
  $("infoName").textContent = l.nombre;
  const chips = [t(TIPO[l.tipo]), distDir(l)];
  if (l.tipo !== "z") chips.push(t("masl", { n: Math.round(l.alt).toLocaleString(locale()) }));
  if (l.hidden) chips.push(t("hiddenByRelief"));
  if (l.onHorizon) chips.push(t("notVisible"));
  $("chips").replaceChildren(...chips.map((t) => Object.assign(document.createElement("span"), { textContent: t })));

  const fotos = d?.fotos || [];
  $("carousel").replaceChildren(...fotos.map((f, i) => {
    const a = Object.assign(document.createElement("a"), { href: f.fuente, target: "_blank", rel: "noopener" });
    a.append(Object.assign(document.createElement("img"), { src: f.src, alt: t("photoN", { name: l.nombre, n: i + 1 }), loading: i ? "lazy" : "eager" }));
    return a;
  }));
  $("dots").replaceChildren(...(fotos.length > 1 ? fotos.map((_, i) => Object.assign(document.createElement("i"), { className: i ? "" : "on" })) : []));
  $("carousel").scrollLeft = 0;

  // En inglés: el artículo de Wikipedia en inglés si existe; si no, el de español.
  const en = getLang() === "en" && d?.url_en;
  $("infoText").textContent = (en ? d.texto_en : d?.texto) || t("noDesc");
  const link = Object.assign(document.createElement("a"), { target: "_blank", rel: "noopener" });
  link.href = (en ? d.url_en : d?.url) || `https://${getLang()}.m.wikipedia.org/w/index.php?search=${encodeURIComponent(l.nombre + " Jalisco")}`;
  link.textContent = t(d?.url ? "readMore" : "searchWiki");
  $("infoLink").replaceChildren(link);
  $("credits").replaceChildren(...fotos.map((f, i) => {
    const li = document.createElement("li");
    li.append(`${t("photoCredit", { n: i + 1, autor: f.autor })}${f.licencia ? ", " + f.licencia : ""} · `,
      Object.assign(document.createElement("a"), { href: f.fuente, target: "_blank", rel: "noopener", textContent: "Wikimedia Commons" }));
    return li;
  }));
  if (d) $("credits").append(Object.assign(document.createElement("li"), { textContent: t("textCredit") }));
  openSheet("infoPanel");
  $("infoClose").focus();
}
$("carousel").addEventListener("scroll", (e) => {
  const i = Math.round(e.target.scrollLeft / e.target.clientWidth);
  [...$("dots").children].forEach((d, k) => (d.className = k === i ? "on" : ""));
});
$("infoClose").onclick = () => (infoBack ? openFind() : closeSheets());

// --- Buscar: flecha hacia un lugar elegido ---
let target = null, guideMsg = "";
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

function drawTarget(W, H, heading) {
  const l = items.find((i) => i.nombre === target);
  if (!l) return;
  const turn = wrap(l.bearing - heading);
  const msg = Math.abs(turn) < 4 ? t("ahead", { name: l.nombre, dist: fmtDist(l.dist) })
    : t(turn > 0 ? "turnR" : "turnL", { name: l.nombre, deg: Math.round(Math.abs(turn)) });
  if (msg !== guideMsg) $("guideText").textContent = guideMsg = msg;

  const top = 110, bottom = H - 170;
  const p = P(l.bearing, l.el);
  ctx.save();
  if (p && p.x > 24 && p.x < W - 24 && p.y > top && p.y < bottom) {
    // En pantalla: anillo que late sobre el lugar.
    const r = 20 + 5 * Math.sin(performance.now() / 180);
    ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.stroke();
  } else {
    // Fuera de pantalla: flecha en el borde. Si está detrás, apunta hacia el lado más corto.
    const d = dirVector(l.bearing - corr, l.el), b = view.b;
    const behind = dot3(d, b.fwd) <= 0;
    const ang = behind ? (turn > 0 ? 0 : Math.PI) : Math.atan2(-dot3(d, b.up), dot3(d, b.right));
    const c = Math.cos(ang), s = Math.sin(ang), cx = W / 2, cy = (top + bottom) / 2, m = 30;
    const t = Math.min(c ? (c > 0 ? W - m - cx : cx - m) / Math.abs(c) : Infinity, s ? (s > 0 ? bottom - cy : cy - top) / Math.abs(s) : Infinity);
    ctx.translate(cx + c * t, cy + s * t); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-12, -14); ctx.lineTo(-6, 0); ctx.lineTo(-12, 14); ctx.closePath();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.stroke();
    ctx.fillStyle = "#ffd54a"; ctx.fill();
  }
  ctx.restore();
}

async function shareShot() {
  const W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
  const c = document.createElement("canvas");
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext("2d");
  x.fillStyle = "#111"; x.fillRect(0, 0, c.width, c.height);
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw) { const k = Math.max(W / vw, H / vh); x.drawImage(video, ((W - vw * k) / 2) * dpr, ((H - vh * k) / 2) * dpr, vw * k * dpr, vh * k * dpr); }

  x.fillText(`Visor GDL · ${$("status").textContent.split(" · ")[0]} · ${new Date().toLocaleDateString(locale())}`, 12, H - 17);

// --- Calibración guiada: tocar la punta real del Hotel Riu y luego la del Fiesta Americana ---
// El primero fija rumbo e inclinación; el segundo los afina y, si lo tocas lejos del centro, también el zoom.
const GUIA = ["Hotel Riu", "Fiesta Americana"];
let guided = null; // índice en GUIA del lugar que toca ahora

function startGuided() {
  const ok = GUIA.every((n) => { const l = items.find((i) => i.nombre === n); return l && !l.hidden && l.dist < 15000; });
  if (!ok) return startAuto(); // lejos de la azotea (o no se ven): usa el horizonte
  if (!basis) { toast(t("loading")); return; }

}

// --- Calibración automática ---
// Busca en la cámara la línea entre cielo y tierra y la desliza sobre el horizonte del relieve y las torres.
// Lo que mejor coincide da el error de la brújula y de la inclinación. Luego pide confirmar.
let autoMode = false, autoPending = false, autoLast = 0, autoFails = 0, autoDots = null;
let stillRef = null, stillSince = 0;
const grab = document.createElement("canvas"), gctx = grab.getContext("2d", { willReadFrequently: true });

function startAuto() {
  if (!video.videoWidth) return startCal(); // sin cámara: solo a mano
  if (!pos || !basis || !skyline) { toast(t("loading")); return; }
  endCal();
  autoMode = true; autoFails = 0; autoLast = performance.now();
  $("focusCard").hidden = true; $("guide").hidden = true;
  banner(t("skyAim"), [t("skip"), skipAuto]);
}
function skipAuto() { endCal(); toast(t("skipped")); }

// Llamada en cada cuadro mientras autoMode, después de fijar view.
function autoStep() {
  const now = performance.now(), fwd = basis.fwd;
  if (!stillRef || Math.acos(Math.min(1, fwd[0] * stillRef[0] + fwd[1] * stillRef[1] + fwd[2] * stillRef[2])) * DEG > 1) { stillRef = fwd; stillSince = now; }
  if (now - stillSince < 600 || now - autoLast < 700) return;
  autoLast = now;
  const m = tryAuto();
  if (m.ok) return applyAuto(m);
  if (++autoFails === 6) {
    banner(t(m.reason === "plano" ? "flat" : "noEdge"), [t("tapPlace"), startCal], [t("skip"), skipAuto]);
  }
}

function tryAuto() {
  const W = innerWidth, H = innerHeight, vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(W / vw, H / vh), w = 160, h = Math.round((160 * H) / W), kx = W / w, ky = H / h;
  grab.width = w; grab.height = h;
  gctx.drawImage(video, (vw - W / sc) / 2, (vh - H / sc) / 2, W / sc, H / sc, 0, 0, w, h);
  const { b, f, cx, cy } = view;
  const dirAt = (x, y) => {
    const u = x - cx, v = cy - y, r = b.fwd.map((q, i) => q + (b.right[i] * u) / f + (b.up[i] * v) / f);
    return { az: (Math.atan2(r[0], r[1]) * DEG + corr + 360) % 360, el: Math.asin(r[2] / Math.hypot(...r)) * DEG };
  };
  // Horizonte esperado: relieve más el techo de los edificios conocidos que no estén tapados.
  const S = withTowers(skylineAt, items.filter((l) => l.tipo === "e" && !l.hidden)
    .map((l) => ({ ...l, base: l.alt - l.h, poly: (PERFILES[l.perfil] || PERFILES.bloque).poly })), viewerAlt());
  // Solo se busca en las filas donde podría estar el horizonte: rumbo ±55° (vista + error de brújula), altura ±3°.
  const c = dirAt(cx, cy).az;
  let lo = Infinity, hi = -Infinity;
  for (let a = -55; a <= 55; a += 0.1) { const e = S(c + a); lo = Math.min(lo, e); hi = Math.max(hi, e); }
  const band = (x) => {
    let y0 = h, y1 = -1;
    for (let y = 0; y < h; y++) { const e = dirAt((x + 0.5) * kx, y * ky).el; if (e <= hi + 3 && y < y0) y0 = y; if (e >= lo - 3) y1 = y; }
    return [y0, y1];
  };
  const rows = skyEdges(gctx.getImageData(0, 0, w, h).data, w, h, band);
  const pts = rows.flatMap((y, x) => (y < 0 ? [] : [dirAt((x + 0.5) * kx, y * ky)]));
  if (pts.length < w * 0.4) return { ok: false, reason: "sin borde" };
  return { ...matchSkyline(pts, S), pts };
}

function applyAuto(m) {
  const newCorr = wrap(corr + m.dh), pitch = cfg.pitch + m.dp;
  if (Math.abs(pitch) > 10) return;
  if (usingGyro()) {
    gyroCorr = newCorr;
    if (absBasis) cfg.corr = wrap(headingPitch(relBasis).heading + gyroCorr - headingPitch(absBasis).heading);
  } else cfg.corr = newCorr;
  store.set("corr", cfg.corr);
  cfg.pitch = pitch; store.set("pitch", pitch);
  calibrated = true; autoMode = false;
  autoDots = m.pts.map((p) => ({ az: p.az + m.dh, el: p.el + m.dp }));
  banner(t("skyConfirm"), [t("yes"), () => { endCal(); toast(t("calDoneShift")); }], [t("no"), startCal]);
}

function calTap(x, y) {
  const { b, f, cx, cy } = view;
  const u = x - cx, v = cy - y;
  const ray = b.fwd.map((k, i) => k + (b.right[i] * u) / f + (b.up[i] * v) / f);
  const len = Math.hypot(...ray);
  // Candidatos: los lugares más cercanos a donde tocaste, según la calibración actual.
  const near = items.filter((l) => !l.onHorizon).map((l) => {
    const d = dirVector(l.bearing - corr, l.el);
    return { l, ang: Math.acos(Math.min(1, (d[0] * ray[0] + d[1] * ray[1] + d[2] * ray[2]) / len)) };
  }).sort((a, b) => a.ang - b.ang);
  markTap(x, y);
  // Si la calibración está muy mal, lo que tocaste no sale entre los 6 más cercanos: "Otro lugar…" muestra todos.
  const item = (l) => {
    const li = document.createElement("li");
    const btn = Object.assign(document.createElement("button"), { className: "btn" });
    btn.append(l.nombre, Object.assign(document.createElement("small"), { textContent: fmtDist(l.dist) }));
    btn.onclick = () => calPick(l);
    li.append(btn);
    return li;
  };
  const more = Object.assign(document.createElement("button"), { className: "btn plain", textContent: t("otherPlace") });
  more.onclick = () => $("pickList").replaceChildren(...near.map(({ l }) => l).sort((a, b) => a.nombre.localeCompare(b.nombre, getLang())).map(item));
  const li = document.createElement("li"); li.append(more);
  $("pickList").replaceChildren(...near.slice(0, 6).map(({ l }) => item(l)), li);
  openSheet("pickPanel");
}
// Guarda la orientación del teléfono y dónde tocaste.
function markTap(x, y) {
  pending = { basis: { ...basis }, u: x - view.cx, v: view.cy - y, kind: usingGyro() ? "rel" : "abs" };
  Object.assign($("tapMark").style, { left: x + "px", top: y + "px" });
  $("tapMark").hidden = false;
}
function cancelPick() { pending = null; $("tapMark").hidden = true; closeSheets(); }
$("pickCancel").onclick = cancelPick;

function calPick(l) {
  closeSheets();
  $("tapMark").hidden = true;
  const now = Date.now();
  // Solo se combinan toques recientes hechos con el mismo sensor.
  const pts = [...calPoints.filter((p) => p.kind === pending.kind && now - p.t < 180000).slice(-2),
    { ...pending, bearing: l.bearing, el: l.el, t: now, nombre: l.nombre }];
  const spread = Math.max(...pts.map((a) => Math.max(...pts.map((b) => Math.abs(wrap(a.bearing - b.bearing))))));
  // El zoom solo se puede medir si algún toque cayó lejos del centro de la pantalla.
  const fitF = pts.length >= 2 && spread >= 10 && Math.max(...pts.map((p) => Math.hypot(p.u, p.v))) > 80;
  const s = solveCalibration(pts, { corr, pitch: cfg.pitch, f: focal() }, fitF);
  const fov = fitF ? fovFromF(s.f) : cfg.fov;
  if (!Number.isFinite(s.corr) || Math.abs(s.pitch) > 10 || fov < 30 || fov > 110) {
    toast(t("tapMismatch"));
    calPoints = []; pending = null;
    return;
  }
  if (pending.kind === "rel") {
    gyroCorr = s.corr;
    if (absBasis) cfg.corr = wrap(headingPitch(relBasis).heading + gyroCorr - headingPitch(absBasis).heading);
  } else cfg.corr = s.corr;
  store.set("corr", cfg.corr);
  cfg.pitch = s.pitch; store.set("pitch", cfg.pitch);
  if (fitF) { cfg.fov = Math.round(fov * 10) / 10; store.set("fov", cfg.fov); syncFov(); }
  calibrated = true;
  calPoints = pts; pending = null;
  if (guided === 0) { guided = 1; guideStep(); return; }
  if (guided === 1) { endCal(); toast(t(fitF ? "calDone" : "calOneMore")); return; }
  if (fitF) { endCal(); toast(t("calDoneDrift")); }
  else banner(t("calWith", { name: l.nombre }), [t("finish"), endCal]);
}

// Arrastrar la vista: los nombres siguen al dedo. Lado a lado corrige el rumbo, arriba/abajo la inclinación.
let drag = null, dragged = false;
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; dragged = false; });
cv.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id || !view) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragged && Math.hypot(dx, dy) < 10) return;
  dragged = true;
  nudge(-Math.atan(dx / view.f) * DEG, Math.atan(dy / view.f) * DEG);
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = () => {
  if (dragged) { store.set("corr", cfg.corr); store.set("pitch", cfg.pitch); }
  drag = null;
};
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
function nudge(dh, dp) {
  if (usingGyro()) {
    gyroCorr = (gyroCorr ?? autoCorr ?? corr) + dh; corr = gyroCorr;
    if (absBasis) cfg.corr = wrap(headingPitch(relBasis).heading + gyroCorr - headingPitch(absBasis).heading);
  } else { cfg.corr = wrap(cfg.corr + dh); corr = cfg.corr; }
  cfg.pitch = Math.max(-10, Math.min(10, cfg.pitch + dp));
  calibrated = true;
}

cv.addEventListener("click", (e) => {
  if (!view || dragged) return;
  if (calMode && guided != null) { markTap(e.clientX, e.clientY); return calPick(items.find((i) => i.nombre === GUIA[guided])); }
  if (calMode) return calTap(e.clientX, e.clientY);
  const h = hits.find((h) => e.clientX >= h.x0 && e.clientX <= h.x1 && e.clientY >= h.y0 && e.clientY <= h.y1);

// Mapa sin librerías: teselas de OpenStreetMap en un canvas. Se arrastra con el dedo; zoom con botones.
const TILE = 256;
const toTile = (lat, lon, z) => {
  const n = 2 ** z, r = (lat * Math.PI) / 180;
  return { x: ((lon + 180) / 360) * n, y: ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * n };
};
const fromTile = (x, y, z) => {
  const n = 2 ** z;
  return { lat: (Math.atan(Math.sinh(Math.PI * (1 - (2 * y) / n))) * 180) / Math.PI, lon: (x / n) * 360 - 180 };
};
// overlay(g, px) dibuja encima; px(lat, lon) da la posición en el canvas. onTap({ lat, lon }, x, y).
function makeMap(canvas, z, { overlay, onTap }) {
  const m = { z, c: null, px: null };
  const tiles = new Map(); // ponytail: guarda todas las teselas vistas en memoria; basta para una sesión
  let raf = 0, drag = null;
  m.draw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); };
  m.zoom = (d) => { m.z = Math.max(4, Math.min(18, m.z + d)); m.draw(); };
  function paint() {
    const g = canvas.getContext("2d"), dpr = devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !m.c) return;
    canvas.width = W * dpr; canvas.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = "#222"; g.fillRect(0, 0, W, H);
    const c = toTile(m.c.lat, m.c.lon, m.z), n = 2 ** m.z;
    m.px = (lat, lon) => { const q = toTile(lat, lon, m.z); return { x: W / 2 + (q.x - c.x) * TILE, y: H / 2 + (q.y - c.y) * TILE }; };
    for (let x = Math.floor(c.x - W / 2 / TILE); x <= Math.floor(c.x + W / 2 / TILE); x++)
      for (let y = Math.max(0, Math.floor(c.y - H / 2 / TILE)); y <= Math.min(n - 1, Math.floor(c.y + H / 2 / TILE)); y++) {
        const key = `${m.z}/${((x % n) + n) % n}/${y}`;
        let img = tiles.get(key);
        if (!img) { img = new Image(); img.onload = m.draw; img.src = `https://tile.openstreetmap.org/${key}.png`; tiles.set(key, img); }
        if (img.complete && img.naturalWidth) g.drawImage(img, Math.round(W / 2 + (x - c.x) * TILE), Math.round(H / 2 + (y - c.y) * TILE), TILE, TILE);
      }
    overlay(g, m.px);
  }
  canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag || !m.c) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 8) return;
    const c = toTile(m.c.lat, m.c.lon, m.z);
    m.c = fromTile(c.x - dx / TILE, c.y - dy / TILE, m.z);
    Object.assign(drag, { x: e.clientX, y: e.clientY, moved: true });
    m.draw();
  });
  canvas.addEventListener("pointerup", (e) => {
    if (drag && !drag.moved && m.c) {
      const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, c = toTile(m.c.lat, m.c.lon, m.z);
      onTap(fromTile(c.x + (x - r.width / 2) / TILE, c.y + (y - r.height / 2) / TILE, m.z), x, y);
    }
    drag = null;
  });
  canvas.addEventListener("pointercancel", () => (drag = null));
  return m;
}
const dot = (g, p, r, fill) => { g.lineWidth = 3; g.strokeStyle = "#000"; g.fillStyle = fill; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.stroke(); g.fill(); };
const mapLabel = (g, text, x, y) => {
  g.font = "600 13px system-ui, sans-serif"; g.textBaseline = "middle"; g.lineJoin = "round";
  g.lineWidth = 4; g.strokeStyle = "rgba(0,0,0,.85)"; g.strokeText(text, x, y); g.fillStyle = "#fff"; g.fillText(text, x, y);
};

// Lugar guardado: un pin rojo donde tocas. Zoom 17 (~1.2 m por pixel).
let pin = null;
const spotMap = makeMap($("spotMap"), 17, {
  overlay: (g, px) => pin && dot(g, px(pin.lat, pin.lon), 9, "#ff4d4d"),
  onTap: (ll) => { pin = ll; spotMap.draw(); },
});
// Sin posición todavía: el último GPS conocido, o el centro de Guadalajara.
const GDL = { lat: 20.6767, lon: -103.3475 };
function newSpot() {
  const c = pos || store.get("lastPos", null) || GDL;
  pin = { lat: c.lat, lon: c.lon }; spotMap.c = { ...pin };
  $("spotNew").hidden = false; $("spotAdd").hidden = true;
  $("spotFloor").value = cfg.floor; $("spotName").value = "";
  spotMap.draw();
}
$("spotAdd").onclick = newSpot;
function pickOnMap() { $("denied").hidden = true; gpsHelp = false; $("banner").hidden = true; openSpots(); newSpot(); }
$("spotZoomIn").onclick = () => spotMap.zoom(1);
$("spotZoomOut").onclick = () => spotMap.zoom(-1);

// Lugares cerca: puntos de colores; tocar uno abre sus detalles.
let mapHits = [];
const findMap = makeMap($("findMap"), 12, {
  overlay: (g, px) => {
    mapHits = [];
    const W = g.canvas.clientWidth, H = g.canvas.clientHeight, taken = [];
    // Los más cercanos primero; un nombre solo se escribe si no tapa otro (el punto sí se dibuja).
    const fits = (x0, y, w) => !taken.some(([a, b, c]) => x0 < b && x0 + w > a && Math.abs(y - c) < 17) && taken.push([x0, x0 + w, y]);
    const me = pos && px(pos.lat, pos.lon);
    if (me) fits(me.x - 10, me.y, 60);
    for (const l of [...items].sort((a, b) => a.dist - b.dist)) {
      const p = px(l.lat, l.lon);
      if (p.x < -20 || p.y < -20 || p.x > W + 20 || p.y > H + 20) continue;
      dot(g, p, 7, COLOR[l.tipo]);
      g.font = "600 13px system-ui, sans-serif";
      if (fits(p.x - 8, p.y, g.measureText(l.nombre).width + 22)) mapLabel(g, l.nombre, p.x + 11, p.y);
      mapHits.push({ l, ...p });
    }
    if (me) { dot(g, me, 8, "#4fc3ff"); mapLabel(g, t("you"), me.x + 12, me.y); }
  },
  onTap: (_, x, y) => {
    const h = mapHits.map((h) => ({ ...h, d: Math.hypot(h.x - x, h.y - y) })).sort((a, b) => a.d - b.d)[0];
    if (h && h.d < 28) openInfo(h.l, true);
  },
});
$("zoomIn").onclick = () => findMap.zoom(1);
$("zoomOut").onclick = () => findMap.zoom(-1);
$("spotSave").onclick = () => {
  const nombre = $("spotName").value.trim().slice(0, 30), floor = Number($("spotFloor").value);
  if (!nombre) { toast(t("needName")); return; }
  if (!(floor >= 0 && floor <= 100) || $("spotFloor").value === "") { toast(t("floorRange")); return; }
  spots = [...spots.filter((x) => x.nombre !== nombre), { nombre, lat: pin.lat, lon: pin.lon, floor }];
  store.set("spots", spots);
  useSpot(nombre); closeSheets(); toast(t("saved", { name: nombre }));
};

// --- Ajustes ---
// Idioma: el guardado, o el del navegador.
initLang(store.get("lang", null));
applyLang();
$("inLang").replaceChildren(...Object.entries(LANGS).map(([k, v]) => new Option(v, k, false, k === getLang())));
$("inLang").onchange = (e) => { setLang(e.target.value); store.set("lang", getLang()); applyLang(); syncFov(); focus = null; };
const syncFov = () => { $("inFov").value = cfg.fov; $("fovOut").textContent = t("setFov", { n: Math.round(cfg.fov) }); };
$("inFloor").value = cfg.floor; syncFov();
if (cfg.ground != null) $("inGround").value = cfg.ground;
function setFloor(val) {
  const v = Number(val);
  if (val === "" || !(v >= 0 && v <= 100)) return;
  cfg.floor = v; store.set("floor", v); $("inFloor").value = $("calFloor").value = v; recompute();
}
$("inFloor").onchange = (e) => setFloor(e.target.value);
$("inGround").onchange = (e) => {
  if (e.target.value === "") { store.set("groundManual", null); if (pos) loadRelief(pos.lat, pos.lon); return; }
  const v = Number(e.target.value);
  if (v >= 0 && v <= 5000) { cfg.ground = v; store.set("groundManual", v); recompute(); }
};
$("inFov").oninput = (e) => { cfg.fov = Number(e.target.value); syncFov(); store.set("fov", cfg.fov); };
// Vuelve a la brújula tal cual: sin corrección de rumbo, inclinación ni zoom.
function resetCal() {
  cfg.corr = DECLINATION; cfg.pitch = 0; cfg.fov = 65;
  store.set("corr", cfg.corr); store.set("pitch", 0); store.set("fov", 65); syncFov();
  gyroCorr = autoCorr = null; calibrated = false; calPoints = [];
}
$("calReset").onclick = () => { resetCal(); toast(t("calReset")); };
$("btnSet").onclick = () => openSheet("setPanel");
$("setClose").onclick = closeSheets;

// --- Arranque ---
// ?sim=lat,lon,rumbo,inclinación  prueba en computadora sin sensores ni cámara.
const sim = new URLSearchParams(location.search).get("sim")?.split(",").map(Number);

// Sin cámara (bloqueada, no hay, o el usuario lo eligió): se usan la lista y el mapa.
let noCam = false;
function setNoCam(on) {
  noCam = on;
  for (const id of ["cross", "btnFreeze", "btnShot"]) $(id).hidden = on;
}

// Permisos bloqueados: pantalla con pasos para Chrome Android y Safari iPhone, y botón para reintentar.
const blocked = new Set(); // "cam", "loc"
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function showDenied() {
  if (!blocked.size) { $("denied").hidden = true; return; }
  $("deniedWhat").textContent = [...blocked].map((k) => t(k === "cam" ? "deniedCam" : "deniedLoc")).join(" ");
  $("deniedSteps").prepend($("deniedSteps").querySelector(`[data-os="${isIOS ? "ios" : "android"}"]`));
  $("deniedAlt").textContent = t(blocked.has("cam") ? "deniedNoCam" : "deniedPickMap");
  closeSheets(); $("banner").hidden = true;
  $("denied").hidden = false;
  $("deniedRetry").focus();
}
$("deniedRetry").onclick = () => {
  $("denied").hidden = true;
  if (blocked.delete("cam")) startCamera();
  if (blocked.delete("loc")) startGps();
};
$("deniedAlt").onclick = () => {
  if (!blocked.delete("cam")) return pickOnMap();
  setNoCam(true);
  if (blocked.size) return showDenied();
  $("denied").hidden = true; openFind();
};

async function startCamera() {
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
    });
    setNoCam(false);
    autoPending = true; // calibración automática al abrir, en cuanto haya GPS, relieve y video
  } catch (e) {
    if (e.name === "NotAllowedError" || e.name === "SecurityError") { blocked.add("cam"); showDenied(); return; }
    setNoCam(true); toast(t("noCam")); openFind(); // el teléfono no tiene cámara o no se pudo abrir
  }
}

// GPS: si en 10 s no hay posición, se ofrece ayuda y elegirla en el mapa.
let watchId = null, gpsTimer = 0, gpsHelp = false;
function startGps() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPosition, (e) => {
    if (e.code === e.PERMISSION_DENIED) { blocked.add("loc"); showDenied(); }
  }, { enableHighAccuracy: true, maximumAge: 5000 });
  clearTimeout(gpsTimer);
  gpsTimer = setTimeout(() => {
    if (pos || !$("denied").hidden || calMode || autoMode) return;
    gpsHelp = true;
    banner(t("gpsHelp"), [t("gpsPick"), pickOnMap], [t("gpsKeepWaiting"), () => { $("banner").hidden = true; gpsHelp = false; }]);
  }, 10000);
}

async function startApp(camera) {
  // iPhone: los sensores de movimiento piden permiso, y solo se puede pedir al tocar.
  try { await DeviceOrientationEvent.requestPermission?.(); } catch {}
  $("start").hidden = true;
  draw();
  if (sim) {
    const [lat, lon, h, p] = sim;
    cfg.corr = 0; cfg.pitch = 0;
    onPosition({ coords: { latitude: lat, longitude: lon, accuracy: 0 } });
    absBasis = cameraBasis(-h, 90 + p, 0);
    addEventListener("deviceorientationabsolute", onAbsolute); // las pruebas pueden girar el teléfono
    if (!camera) { setNoCam(true); openFind(); }
    return;
  }
  if (camera) startCamera(); else { setNoCam(true); openFind(); }
  applyPos(); // si hay un lugar guardado en uso, no hace falta esperar al GPS
  startGps();
  if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", onAbsolute);
  addEventListener("deviceorientation", onRelative);
  try { await navigator.wakeLock?.request("screen"); } catch {}
}
$("btnStart").onclick = () => startApp(true);
$("btnNoCam").onclick = () => startApp(false);
$("whyMotion").hidden = typeof DeviceOrientationEvent?.requestPermission !== "function";
if (sim) $("btnStart").click();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
